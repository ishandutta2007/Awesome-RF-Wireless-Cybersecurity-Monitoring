<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0d1b2a"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="cyanGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f5d4" stop-opacity=".8"/><stop offset="100%" stop-color="#00bbf9" stop-opacity=".9"/></linearGradient><linearGradient id="purpleGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#7209b7" stop-opacity=".7"/><stop offset="100%" stop-color="#f72585" stop-opacity=".6"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#fff"/><stop offset="60%" stop-color="#e0fbfc"/><stop offset="100%" stop-color="#00f5d4"/></linearGradient><pattern id="radarGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1b2a47" stroke-opacity=".4" stroke-width=".7" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="3"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes radarSweep{0%{transform:rotate(0deg)}}@keyframes pulseWave{0%{r:20px;opacity:.9}50%{opacity:.4}}@keyframes waveDash{0%{stroke-dashoffset:0}}@keyframes blipBlink{0%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.3)}}.radar-sweep{transform-origin:1020px 180px;animation:radarSweep 6s linear infinite}.pulse-ring-1,.pulse-ring-2{animation:pulseWave 4s cubic-bezier(.2,.6,.4,1) infinite;transform-origin:1020px 180px}.pulse-ring-2{animation-delay:2s}.rf-wave-1{stroke-dasharray:16 8;animation:waveDash 10s linear i