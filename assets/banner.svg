e cx="1020" cy="180" r="20" fill="none" stroke="#00bbf9" stroke-width="1.5" class="pulse-ring-2"/><g class="radar-sweep"><path fill="url(#cyanGrad)" d="M 1020 180 L 1160 140 A 140 140 0 0 1 1160 180 Z" filter="url(#softGlow)" opacity=".28"/><line x1="1020" x2="1160" y1="180" y2="180" stroke="#00f5d4" stroke-width="2" opacity=".8"/></g><circle cx="950" cy="130" r="4.5" fill="#f72585" class="blip-1" filter="url(#softGlow)"/><circle cx="1070" cy="230" r="4" fill="#00f5d4" class="blip-2" filter="url(#softGlow)"/><circle cx="1090" cy="110" r="3.5" fill="#fee440" class="blip-3" filter="url(#softGlow)"/></g><g id="foregroundContent"><g transform="translate(60, 48)"><rect width="215" height="28" fill="#0e2338" stroke="#00f5d4" stroke-opacity=".6" stroke-width="1" rx="14"/><circle cx="16" cy="14" r="5" fill="#00f5d4" filter="url(#softGlow)"/><text x="30" y="18" fill="#a8dadc" class="badge-label">WIRELESS &amp; RF CYBERSECURITY</text></g><text x="60" y="128" fill="url(#textGrad)" class="title-text" filter="url(#softGlow)" font-size="35">Awesome RF &amp; Wireless</text><text x="60" y="172" fill="#fff" class="title-text" font-size="33">Cybersecurity Monitoring</text><text x="60" y="215" fill="#90e0ef" class="subtitle-text" font-size="15">Curated ecosystem of Wireless Intrusion Detection (WIDS/WIPS), SDR spectrum intelligence,</text><text x="60" y="238" fill="#90e0ef" class="subtitle-text" font-size="15">cellular IMSI-catcher defense, 802.11 Wi-Fi auditing, and Bluetooth Low Energy surveillance monitoring.</text><g><g transform="translate(60, 275) translate(0, 0)"><rect width="130" height="26" fill="#13243d" stroke="#1d3557" stroke-width="1" rx="6"/><text x="12" y="17" fill="#00f5d4" class="badge-label">📡 WIDS / WIPS</text></g><g transform="translate(60, 275) translate(142, 0)"><rect width="150" height="26" fill="#13243d" stroke="#1d3557" stroke-width="1" rx="6"/><text x="12" y="17" fill="#00bbf9" class="badge-label">📻 SDR Spectrum</text></g><g transform="translate(60, 275) tran