<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00bbf9" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7209b7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#f72585" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0fbfc" />
      <stop offset="100%" stop-color="#00f5d4" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="radarGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1b2a47" stroke-width="0.7" stroke-opacity="0.4" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Radar Beam Sweep Animation */
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Pulse Waves */
    @keyframes pulseWave {
      0% { r: 20px; opacity: 0.9; }
      50% { opacity: 0.4; }
      100% { r: 230px; opacity: 0; }
    }

    /* Sine Wave Motion */
    @keyframes waveDash {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -400; }
    }

    /* Blinking RF Detection Blips */
    @keyframes blipBlink {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    .radar-sweep {
      transform-origin: 1020px 180px;
      animation: radarSweep 6s linear infinite;
    }

    .pulse-ring-1 {
      animation: pulseWave 4s cubic-bezier(0.2, 0.6, 0.4, 1) infinite;
      transform-origin: 1020px 180px;
    }

    .pulse-ring-2 {
      animation: pulseWave 4s cubic-bezier(0.2, 0.6, 0.4, 1) infinite;
      animation-delay: 2s;
      transform-origin: 1020px 180px;
    }

    .rf-wave-1 {
      stroke-dasharray: 16 8;
      animation: waveDash 10s linear infinite;
    }

    .rf-wave-2 {
      stroke-dasharray: 20 10;
      animation: waveDash 15s linear infinite;
    }

    .blip-1 { animation: blipBlink 2.2s ease-in-out infinite; transform-origin: 950px 130px; }
    .blip-2 { animation: blipBlink 3.1s ease-in-out infinite 0.7s; transform-origin: 1070px 230px; }
    .blip-3 { animation: blipBlink 2.6s ease-in-out infinite 1.4s; transform-origin: 1090px 110px; }

    /* Static Foreground Typography */
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 400;
      letter-spacing: 0.2px;
    }

    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="14" fill="url(#bgGrad)" />

  <!-- Ambient Glow Background Blobs (Kept behind) -->
  <circle cx="1020" cy="180" r="140" fill="url(#purpleGrad)" opacity="0.3" filter="url(#glow)" />
  <circle cx="200" cy="80" r="160" fill="url(#cyanGrad)" opacity="0.12" filter="url(#glow)" />

  <!-- Digital Radar Grid -->
  <rect width="1200" height="360" rx="14" fill="url(#radarGrid)" />

  <!-- Dynamic RF Sine / Spectrum Waves (Background) -->
  <path class="rf-wave-1" d="M 0 310 Q 150 270 300 310 T 600 310 T 900 310 T 1200 310" fill="none" stroke="#00f5d4" stroke-width="1.5" opacity="0.25" />
  <path class="rf-wave-2" d="M 0 325 Q 180 355 360 325 T 720 325 T 1080 325 T 1440 325" fill="none" stroke="#00bbf9" stroke-width="1.2" opacity="0.2" />

  <!-- Radar Visualization Group (Right Side) -->
  <g id="radarGroup">
    <!-- Concentric Distance Range Rings -->
    <circle cx="1020" cy="180" r="50" fill="none" stroke="#1d3557" stroke-width="1.2" stroke-opacity="0.7" />
    <circle cx="1020" cy="180" r="95" fill="none" stroke="#1d3557" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="4 4" />
    <circle cx="1020" cy="180" r="140" fill="none" stroke="#1d3557" stroke-width="1.2" stroke-opacity="0.5" />

    <!-- Crosshair Lines -->
    <line x1="870" y1="180" x2="1170" y2="180" stroke="#1d3557" stroke-width="1" stroke-opacity="0.7" />
    <line x1="1020" y1="30" x2="1020" y2="330" stroke="#1d3557" stroke-width="1" stroke-opacity="0.7" />

    <!-- Animated Expanding Pulse Rings -->
    <circle class="pulse-ring-1" cx="1020" cy="180" r="20" fill="none" stroke="#00f5d4" stroke-width="2" />
    <circle class="pulse-ring-2" cx="1020" cy="180" r="20" fill="none" stroke="#00bbf9" stroke-width="1.5" />

    <!-- Animated Sweep Sector Beam -->
    <g class="radar-sweep">
      <path d="M 1020 180 L 1160 140 A 140 140 0 0 1 1160 180 Z" fill="url(#cyanGrad)" opacity="0.28" filter="url(#softGlow)" />
      <line x1="1020" y1="180" x2="1160" y2="180" stroke="#00f5d4" stroke-width="2" opacity="0.8" />
    </g>

    <!-- Radar Target Threat Blips -->
    <circle class="blip-1" cx="950" cy="130" r="4.5" fill="#f72585" filter="url(#softGlow)" />
    <circle class="blip-2" cx="1070" cy="230" r="4" fill="#00f5d4" filter="url(#softGlow)" />
    <circle class="blip-3" cx="1090" cy="110" r="3.5" fill="#fee440" filter="url(#softGlow)" />
  </g>

  <!-- FOREGROUND CONTENT: Header & Meta (Never obscured) -->
  <g id="foregroundContent">
    <!-- Category Pill Tag -->
    <g transform="translate(60, 48)">
      <rect width="215" height="28" rx="14" fill="#0e2338" stroke="#00f5d4" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="16" cy="14" r="5" fill="#00f5d4" filter="url(#softGlow)" />
      <text x="30" y="18" fill="#a8dadc" class="badge-label">WIRELESS &amp; RF CYBERSECURITY</text>
    </g>

    <!-- Main Title -->
    <text x="60" y="128" fill="url(#textGrad)" font-size="35" class="title-text" filter="url(#softGlow)">
      Awesome RF &amp; Wireless
    </text>
    <text x="60" y="172" fill="#ffffff" font-size="33" class="title-text">
      Cybersecurity Monitoring
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="60" y="215" fill="#90e0ef" font-size="15" class="subtitle-text">
      Curated ecosystem of Wireless Intrusion Detection (WIDS/WIPS), SDR spectrum intelligence,
    </text>
    <text x="60" y="238" fill="#90e0ef" font-size="15" class="subtitle-text">
      cellular IMSI-catcher defense, 802.11 Wi-Fi auditing, and Bluetooth Low Energy surveillance monitoring.
    </text>

    <!-- Feature Feature Tag Badges in Foreground -->
    <g transform="translate(60, 275)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="130" height="26" rx="6" fill="#13243d" stroke="#1d3557" stroke-width="1" />
        <text x="12" y="17" fill="#00f5d4" class="badge-label">📡 WIDS / WIPS</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(142, 0)">
        <rect width="150" height="26" rx="6" fill="#13243d" stroke="#1d3557" stroke-width="1" />
        <text x="12" y="17" fill="#00bbf9" class="badge-label">📻 SDR Spectrum</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(304, 0)">
        <rect width="165" height="26" rx="6" fill="#13243d" stroke="#1d3557" stroke-width="1" />
        <text x="12" y="17" fill="#f72585" class="badge-label">🛡️ IMSI Catchers</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(481, 0)">
        <rect width="145" height="26" rx="6" fill="#13243d" stroke="#1d3557" stroke-width="1" />
        <text x="12" y="17" fill="#e0fbfc" class="badge-label">📶 Wi-Fi 6E/7 &amp; BLE</text>
      </g>
    </g>
  </g>
</svg>
